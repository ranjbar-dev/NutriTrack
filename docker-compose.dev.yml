services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./backend/uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/seed"]
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/build
      - frontend_node_modules:/build/node_modules
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutritrack}
      POSTGRES_USER: ${POSTGRES_USER:-nutritrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutritrack} -d ${POSTGRES_DB:-nutritrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  frontend_node_modules:
