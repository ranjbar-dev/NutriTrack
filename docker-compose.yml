services:
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - uploads:/data/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - .\docker\observability\loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - .\docker\observability\promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
    volumes:
      - .\docker\observability\grafana\datasources:/etc/grafana/provisioning/datasources:ro
      - .\docker\observability\grafana\provisioning\dashboards:/etc/grafana/provisioning/dashboards:ro
      - .\docker\observability\grafana\dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - loki
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
    command: ["/bin/sh", "-c", "while true; do /scripts/postgres-backup.sh; sleep ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}; done"]
    volumes:
      - backup-data:/backups
      - .\docker\backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  uploads-backup:
    image: alpine:3.20
    environment:
      BACKUP_ROOT: /backups
    command: ["/bin/sh", "-c", "while true; do /scripts/uploads-backup.sh; sleep ${UPLOADS_BACKUP_INTERVAL_SECONDS:-604800}; done"]
    volumes:
      - uploads:/data/uploads:ro
      - backup-data:/backups
      - .\docker\backup:/scripts:ro
    restart: unless-stopped

  postgres-restore:
    image: postgres:16-alpine
    profiles: ["maintenance"]
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
      RESTORE_DATABASE: ${POSTGRES_DB}
      BACKUP_FILE: ""
    command: ["/bin/sh", "/scripts/restore-postgres.sh"]
    volumes:
      - backup-data:/backups
      - .\docker\backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  uploads-restore:
    image: alpine:3.20
    profiles: ["maintenance"]
    environment:
      BACKUP_ROOT: /backups
      BACKUP_FILE: ""
    command: ["/bin/sh", "/scripts/restore-uploads.sh"]
    volumes:
      - uploads:/data/uploads
      - backup-data:/backups
      - .\docker\backup:/scripts:ro

volumes:
  pgdata:
  letsencrypt:
  uploads:
  loki-data:
  grafana-data:
  backup-data:
