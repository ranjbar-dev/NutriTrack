services:
  postgres:
    image: postgres:16-alpine
    container_name: nutritrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nutritrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nutritrack_secret}
      POSTGRES_DB: ${DB_NAME:-nutritrack}
      TZ: Asia/Tehran
      PGTZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutritrack} -d ${DB_NAME:-nutritrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: nutritrack_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutritrack_app
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      ENV: ${ENV:-production}
      TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-nutritrack}
      DB_PASSWORD: ${DB_PASSWORD:-nutritrack_secret}
      DB_NAME: ${DB_NAME:-nutritrack}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_32chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_32chars_min}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAY: ${JWT_REFRESH_TTL_DAY:-7}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-verify}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
